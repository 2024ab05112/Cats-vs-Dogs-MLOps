name: CI/CD – Cats vs Dogs MLOps Pipeline

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "docs/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── M3: Detect changed paths ───────────────────────────────────────────────
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            k8s:
              - 'k8s/**'
              - '.github/workflows/**'

  # ── M3: Unit Tests + Linting ───────────────────────────────────────────────
  unit-test:
    needs: check-changes
    if: needs.check-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/unit-test-requirements.txt

      - name: Install test dependencies
        working-directory: ./backend
        run: pip install -r unit-test-requirements.txt

      - name: Lint with flake8
        working-directory: ./backend
        run: |
          flake8 src main.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src main.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit tests with pytest
        working-directory: ./backend
        run: |
          pytest tests/ -v --junitxml=test-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/test-report.xml

  # ── M1: Train model + log to MLflow ───────────────────────────────────────
  train-model:
    needs: [check-changes, unit-test]
    if: |
      always() &&
      needs.unit-test.result != 'failure' &&
      (needs.check-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Train Model (MobileNetV2 + MLflow)
        working-directory: ./backend
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'http://localhost:5000' }}
        run: |
          python -m src.models.train

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: backend/model.h5
          retention-days: 7

      - name: Upload confusion matrix
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: backend/artifacts/
          retention-days: 7

  # ── M2/M3: Build & push Backend Docker image ───────────────────────────────
  build-backend:
    needs: [check-changes, train-model]
    if: |
      always() &&
      needs.train-model.result != 'failure' &&
      (needs.check-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: backend/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cats-vs-dogs-api:latest
            ${{ secrets.DOCKER_USERNAME }}/cats-vs-dogs-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── M3: Build & push Frontend Docker image ─────────────────────────────────
  build-frontend:
    needs: [check-changes]
    if: always() && needs.check-changes.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cats-vs-dogs-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/cats-vs-dogs-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── M4: Deploy to Kubernetes (Docker Compose fallback also works) ───────────
  deploy:
    needs: [build-backend, build-frontend, check-changes]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_EKS_CLUSTER_NAME: ${{ secrets.AWS_EKS_CLUSTER_NAME }}
      KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig (AWS EKS or AWS EC2 K3s)
        run: |
          mkdir -p ~/.kube
          if [[ -n "${AWS_EKS_CLUSTER_NAME}" ]]; then
            echo "Updating kubeconfig for AWS EKS cluster: ${AWS_EKS_CLUSTER_NAME}"
            aws eks update-kubeconfig --name "${AWS_EKS_CLUSTER_NAME}" --region "${AWS_REGION:-us-east-1}"
          elif [[ -n "${KUBECONFIG_BASE64}" ]]; then
            echo "Using KUBECONFIG_BASE64 for AWS EC2 / K3s instance"
            python3 -c "import os, base64; open(os.path.expanduser('~/.kube/config'), 'wb').write(base64.b64decode(os.environ['KUBECONFIG_BASE64'].strip()))"
            chmod 600 ~/.kube/config
          else
            echo "Error: Neither AWS_EKS_CLUSTER_NAME nor KUBECONFIG_BASE64 is provided in GitHub secrets."
            exit 1
          fi

      - name: Update backend image tag in manifests
        run: |
          BACKEND_TAG="latest"
          if [[ "${{ needs.check-changes.outputs.backend }}" == "true" ]]; then
            BACKEND_TAG="${{ github.sha }}"
          fi
          sed -i "s|image: .*/cats-vs-dogs-api:.*|image: ${{ secrets.DOCKER_USERNAME }}/cats-vs-dogs-api:${BACKEND_TAG}|g" k8s/backend/backend-deployment.yml

          FRONTEND_TAG="latest"
          if [[ "${{ needs.check-changes.outputs.frontend }}" == "true" ]]; then
            FRONTEND_TAG="${{ github.sha }}"
          fi
          sed -i "s|image: .*/cats-vs-dogs-frontend:.*|image: ${{ secrets.DOCKER_USERNAME }}/cats-vs-dogs-frontend:${FRONTEND_TAG}|g" k8s/frontend/frontend-deployment.yml

      - name: Deploy all Kubernetes manifests
        run: |
          kubectl apply -f k8s/common/
          kubectl apply -f k8s/backend/
          kubectl apply -f k8s/frontend/
          kubectl apply -f k8s/monitoring/

      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/cats-vs-dogs-backend --timeout=180s

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/cats-vs-dogs-frontend --timeout=180s

  # ── M4: Post-deploy smoke tests ────────────────────────────────────────────
  smoke-test:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for pods to stabilize
        run: sleep 45

      - name: Run smoke tests
        run: |
          chmod +x smoke_test.sh
          ./smoke_test.sh
        env:
          BASE_URL: ${{ secrets.APP_BASE_URL }}
